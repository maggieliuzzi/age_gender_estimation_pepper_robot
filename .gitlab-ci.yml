image:
  name: "magiclab/ros-keras:latest"

stages:
  - main

main:
  stage: main
  script:
    - pip install -r requirements.txt
    - 'cd data'
    - '[ -d wiki_crop ] || curl http://blackhole.themagiclab.org/data/gender_detection/wiki_crop.tar | tar x '
    - '[ -d dataset ] && rm -r dataset'
    - 'cd ..'
    - 'export PYTHONPATH=${PWD}'
    - 'python scripts/ex_preprocess.py --s="./data/wiki_crop" --d="./data/dataset"'
  artifacts:
    paths:
      - "data/*.csv"
  when: manual
