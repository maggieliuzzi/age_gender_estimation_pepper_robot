image:
  name: "magiclab/ros-keras:latest"
before_script:
  - pip install -r requirements.txt

stages:
  - main

main:
  stage: main
  script:
    - 'cd data'
    - '[ -d wiki_crop ] || curl http://blackhole.themagiclab.org/data/gender_detection/wiki_crop.tar | tar x '
    - '[ -d dataset ] && rm -r dataset'
    - 'cd ..'
    - python scripts/ex_preprocess.py --s="./dataset/wiki_crop/wiki_crop" --d="D:/dev/magic_profiler/data/dataset2"
  artifacts:
    paths:
      - "data/*.csv"
  when: manual
